# deploy/nginx/auth.app.example.com.conf
# Install: /etc/nginx/sites-available/auth.app.example.com
# Enable:  ln -sf /etc/nginx/sites-available/auth.app.example.com /etc/nginx/sites-enabled/
#
# Domain:        auth.app.example.com
# Public URL:    https://auth.app.example.com
# Issuer:        https://auth.app.example.com/realms/app
# JWKS:          https://auth.app.example.com/realms/app/protocol/openid-connect/certs
#
# TLS: same SAN cert as app (cert-name app.example.com)
#
# Upstream: app-kc (Keycloak 26) → 127.0.0.1:8080
# Health (localhost only, not proxied): curl http://127.0.0.1:9000/health/ready
#
# Keycloak .env alignment:
#   KC_HOSTNAME=https://auth.app.example.com
#   KC_HOSTNAME_STRICT=true
#   KC_HTTP_ENABLED=true
#   KC_PROXY_HEADERS=xforwarded
#   KC_HEALTH_ENABLED=true
#   KC_METRICS_ENABLED=true
#
# GitHub / SPA build:
#   VITE_KEYCLOAK_URL=https://auth.app.example.com
#   VITE_KEYCLOAK_REALM=app
#   VITE_KEYCLOAK_CLIENT_ID=app-web
#
# Backend (Docker app-net):
#   KEYCLOAK_URL=http://keycloak:8080
#   KEYCLOAK_REALM=app

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name auth.app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location ~ ^/(health|metrics)(/|$) {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
